
[project]
name = "wake-agent"
version = "0.3.0-mailbox-core"
description = "Wake a local CLI coding agent on timer, event, or mailbox message, log what it did, report back. Mailbox is now core - generic inbox with raw attachments, zero processing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["watchdog>=3.0"]
authors = [{name="t4skb0x", email="t4skb0x@github"}]

[project.scripts]
wake = "wakeagent.cli:main"
wake-agent = "wakeagent.mailbox:watch_loop"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

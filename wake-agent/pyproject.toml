[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-agent"
version = "0.1.0"
description = "Wake a local CLI coding agent (Muse Code, Kimi Code, Claude Code, Codex) on a timer or event, log what it did, and report via Telegram, Slack, Discord, SMS or ntfy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
keywords = ["agents", "cli", "automation", "alerting", "monitoring", "qa"]

[project.scripts]
wake = "wakeagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
